<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings | CareerForge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">
    <section class="settings-card" aria-labelledby="settings-heading">
      <header class="settings-header">
        <h1 id="settings-heading">Account Settings</h1>
        <p class="settings-subtext">Update your personal details and notification preferences.</p>
      </header>

      <form class="settings-form" novalidate>

        <div class="form-group">
          <label for="fullName">Full Name <span class="required-flag" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            minlength="2"
            maxlength="80"
            autocomplete="name"
            aria-describedby="fullName-hint"
          >
          <p class="field-hint" id="fullName-hint">Required. As it will appear on your profile.</p>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span class="required-flag" aria-hidden="true">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            aria-describedby="email-hint"
          >
          <p class="field-hint" id="email-hint">Required. We'll send account updates here.</p>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            minlength="8"
            autocomplete="new-password"
            aria-describedby="newPassword-hint"
          >
          <p class="field-hint" id="newPassword-hint">Optional. If entered, must be at least 8 characters.</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            aria-describedby="confirmPassword-hint"
          >
          <p class="field-hint" id="confirmPassword-hint">Re-enter the new password to confirm it.</p>
        </div>

        <div class="form-group form-group-checkbox">
          <input
            type="checkbox"
            id="emailNotifications"
            name="emailNotifications"
          >
          <label for="emailNotifications">
            Email Notifications
            <span class="checkbox-subtext">Receive updates about applications and messages.</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit">Save Changes</button>
        </div>

      </form>
    </section>
  </main>

</body>
</html>
